version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: anon_bot_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  bot:
    build: .
    container_name: anon_bot_app
    restart: always
    depends_on:
      - db
    env_file:
      - .env

volumes:
  pgdata: